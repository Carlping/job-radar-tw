# Git hooks for this repository.
# Install once per clone:
#   uvx pre-commit install
# On commit: fast lint and format of the changed Python files.
# On push: the full check, the same one that CI runs.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --frozen --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --extra dev ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: full-check
        name: full check (same as CI)
        entry: uv run --frozen --extra dev python scripts/check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
