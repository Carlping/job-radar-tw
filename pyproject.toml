[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-radar-tw"
version = "0.3.1"
description = "Self-hosted career-site job monitor with Telegram alerts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "tenacity>=8.5,<10",
  "tzdata>=2025,<2027",
  "typer>=0.12,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
llm = [
  "openai>=1.40,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
monitor = "job_monitor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
