name: Setup Job Radar TW

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Send a Telegram message after checking the database"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run monitor validate-config --strict
      - name: Initialize the database safely
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run monitor init-db
      - name: Check database and Telegram
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message }}
        run: |
          args=()
          if [[ "$SEND_TEST_MESSAGE" == "true" ]]; then
            args+=(--send-telegram)
          fi
          uv run monitor doctor "${args[@]}"
